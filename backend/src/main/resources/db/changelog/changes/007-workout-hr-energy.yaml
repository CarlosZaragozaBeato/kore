databaseChangeLog:
  - changeSet:
      id: 007-workout-hr-energy
      author: ccollector
      changes:
        # Revisión de extracción Suunto (Fase 10): la FC máxima y la energía
        # (kcal) sí venían en el payload real pero no se persistían.
        - addColumn:
            tableName: workouts
            columns:
              - column:
                  name: max_heart_rate
                  type: INTEGER
              - column:
                  name: energy_kcal
                  type: DOUBLE

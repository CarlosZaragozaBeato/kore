databaseChangeLog:
  # Fase 0: baseline vacío. Solo crea las tablas de tracking de Liquibase
  # y deja el esquema etiquetado. Las tablas reales (users, workouts, ...)
  # llegan en la Fase 1 como changelogs en changes/.
  - changeSet:
      id: 000-baseline
      author: ccollector
      changes:
        - tagDatabase:
            tag: baseline
  - include:
      file: db/changelog/changes/001-create-users.yaml
  - include:
      file: db/changelog/changes/002-create-workouts.yaml
  - include:
      file: db/changelog/changes/003-suunto-integration.yaml
  - include:
      file: db/changelog/changes/004-create-plans.yaml
  - include:
      file: db/changelog/changes/005-create-gym.yaml

databaseChangeLog:
  - changeSet:
      id: 003-suunto-settings
      author: ccollector
      changes:
        - createTable:
            tableName: suunto_settings
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_suunto_user
                    references: users(id)
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Credenciales cifradas en reposo (AES-GCM).
              - column:
                  name: client_id
                  type: VARCHAR(255)
              - column:
                  name: client_secret_enc
                  type: VARCHAR(1000)
              - column:
                  name: refresh_token_enc
                  type: VARCHAR(4000)
              - column:
                  name: subscription_key_enc
                  type: VARCHAR(1000)
              - column:
                  name: last_sync_at
                  type: VARCHAR(30)
              - column:
                  name: updated_at
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-workouts-source-id
      author: ccollector
      changes:
        # Id del entreno en el origen (Suunto) para deduplicar en la sincronización.
        - addColumn:
            tableName: workouts
            columns:
              - column:
                  name: source_id
                  type: VARCHAR(255)

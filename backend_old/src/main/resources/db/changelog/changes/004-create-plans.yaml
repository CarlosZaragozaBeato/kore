databaseChangeLog:
  - changeSet:
      id: 004-create-training-plans
      author: ccollector
      changes:
        - createTable:
            tableName: training_plans
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_plans_user
                    references: users(id)
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: goal
                  type: VARCHAR(2000)
              - column:
                  name: start_date
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: VARCHAR(10)
              - column:
                  name: created_at
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: training_plans
            indexName: idx_plans_user
            columns:
              - column:
                  name: user_id
  - changeSet:
      id: 004-create-planned-sessions
      author: ccollector
      changes:
        - createTable:
            tableName: planned_sessions
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sessions_plan
                    references: training_plans(id)
              - column:
                  name: date
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: target_distance_meters
                  type: DOUBLE
              - column:
                  name: target_duration_seconds
                  type: BIGINT
              - column:
                  name: description
                  type: VARCHAR(2000)
        - createIndex:
            tableName: planned_sessions
            indexName: idx_sessions_plan
            columns:
              - column:
                  name: plan_id

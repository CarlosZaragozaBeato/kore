databaseChangeLog:
  - changeSet:
      id: 006-create-recipes
      author: ccollector
      changes:
        - createTable:
            tableName: recipes
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_recipes_user, references: users(id)}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: description, type: VARCHAR(2000)}
              - column: {name: servings, type: INT}
              - column: {name: calories, type: DOUBLE}
              - column: {name: protein, type: DOUBLE}
              - column: {name: carbs, type: DOUBLE}
              - column: {name: fat, type: DOUBLE}
              - column: {name: steps, type: VARCHAR(4000)}
              - column: {name: created_at, type: VARCHAR(30), constraints: {nullable: false}}
        - createIndex:
            tableName: recipes
            indexName: idx_recipes_user
            columns:
              - column: {name: user_id}
  - changeSet:
      id: 006-create-recipe-ingredients
      author: ccollector
      changes:
        - createTable:
            tableName: recipe_ingredients
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_ingredients_recipe, references: recipes(id)}
              - column: {name: position, type: INT, constraints: {nullable: false}}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: quantity, type: DOUBLE}
              - column: {name: unit, type: VARCHAR(50)}
        - createIndex:
            tableName: recipe_ingredients
            indexName: idx_ingredients_recipe
            columns:
              - column: {name: recipe_id}
  - changeSet:
      id: 006-create-diet-plans
      author: ccollector
      changes:
        - createTable:
            tableName: diet_plans
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_diets_user, references: users(id)}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: start_date, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: end_date, type: VARCHAR(10)}
              - column: {name: target_calories, type: DOUBLE}
              - column: {name: target_protein, type: DOUBLE}
              - column: {name: target_carbs, type: DOUBLE}
              - column: {name: target_fat, type: DOUBLE}
              - column: {name: notes, type: VARCHAR(2000)}
              - column: {name: created_at, type: VARCHAR(30), constraints: {nullable: false}}
        - createIndex:
            tableName: diet_plans
            indexName: idx_diets_user
            columns:
              - column: {name: user_id}
  - changeSet:
      id: 006-create-diet-meals
      author: ccollector
      changes:
        - createTable:
            tableName: diet_meals
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: diet_plan_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_meals_diet, references: diet_plans(id)}
              - column: {name: date, type: VARCHAR(10), constraints: {nullable: false}}
              - column: {name: meal_type, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: recipe_name, type: VARCHAR(200)}
              - column: {name: notes, type: VARCHAR(1000)}
        - createIndex:
            tableName: diet_meals
            indexName: idx_meals_diet
            columns:
              - column: {name: diet_plan_id}

databaseChangeLog:
  # Fase 11: catálogos base (ingredientes con valores nutricionales) y
  # ampliación del catálogo de ejercicios (categoría/fase + equipamiento).
  - changeSet:
      id: 008-create-ingredients
      author: ccollector
      changes:
        - createTable:
            tableName: ingredients
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_ingredients_catalog_user, references: users(id)}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: base_unit, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: calories, type: DOUBLE}
              - column: {name: protein, type: DOUBLE}
              - column: {name: carbs, type: DOUBLE}
              - column: {name: fat, type: DOUBLE}
              - column: {name: fiber, type: DOUBLE}
              - column: {name: sugars, type: DOUBLE}
              - column: {name: sodium, type: DOUBLE}
        - createIndex:
            tableName: ingredients
            indexName: idx_ingredients_catalog_user
            columns:
              - column: {name: user_id}
  - changeSet:
      id: 008-exercises-category
      author: ccollector
      changes:
        # Categoría/fase de uso (WARMUP/STRENGTH/RECOVERY) y si necesita material.
        - addColumn:
            tableName: exercises
            columns:
              - column: {name: category, type: VARCHAR(20)}
              - column: {name: requires_equipment, type: BOOLEAN}
  - changeSet:
      id: 008-recipe-ingredient-link
      author: ccollector
      changes:
        # Enlace opcional de un ingrediente de receta al catálogo (se conserva el
        # nombre como snapshot; el id permite derivar macros).
        - addColumn:
            tableName: recipe_ingredients
            columns:
              - column: {name: ingredient_id, type: BIGINT}

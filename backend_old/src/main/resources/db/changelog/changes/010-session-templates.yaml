databaseChangeLog:
  # Fase 16: plantillas de sesión específicas (disciplina, objetivo, nivel).
  - changeSet:
      id: 010-create-session-templates
      author: ccollector
      changes:
        - createTable:
            tableName: session_templates
            columns:
              - column: {name: id, type: INTEGER, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: {nullable: false, foreignKeyName: fk_session_templates_user, references: users(id)}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: discipline, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: goal, type: VARCHAR(30)}
              - column: {name: level, type: VARCHAR(30)}
              - column: {name: target_distance_meters, type: DOUBLE}
              - column: {name: target_duration_seconds, type: BIGINT}
              - column: {name: structure, type: VARCHAR(4000)}
              - column: {name: notes, type: VARCHAR(2000)}
        - createIndex:
            tableName: session_templates
            indexName: idx_session_templates_user
            columns:
              - column: {name: user_id}

databaseChangeLog:
  # Fase 24: nutrición conectada. El ingrediente del catálogo gana una imagen
  # para el catálogo visual.
  - changeSet:
      id: 014-ingredient-image
      author: ccollector
      changes:
        - addColumn:
            tableName: ingredients
            columns:
              - column: {name: image_url, type: VARCHAR(500)}

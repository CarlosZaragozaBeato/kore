databaseChangeLog:
  - changeSet:
      id: 016-planned-session-calendar
      author: ccollector
      changes:
        # Fase C (v4): las sesiones planificadas pueden vivir sueltas en el
        # calendario (sin plan), con estado propuesta/aceptada/descartada y
        # agrupadas en variantes para un mismo día (elegir según la situación).
        #
        # SQLite no permite ALTER COLUMN (dropNotNullConstraint no soportado),
        # así que reconstruimos la tabla con el patrón oficial de SQLite:
        # crear la nueva, copiar datos (backfill de user_id desde el plan),
        # borrar la vieja y renombrar. Los ids se preservan, así que la FK de
        # planned_session_steps -> planned_sessions(id) sigue siendo válida.
        - sql:
            splitStatements: true
            sql: >-
              CREATE TABLE planned_sessions_new (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                plan_id BIGINT,
                user_id BIGINT,
                date VARCHAR(10) NOT NULL,
                type VARCHAR(30) NOT NULL,
                target_distance_meters DOUBLE,
                target_duration_seconds BIGINT,
                description VARCHAR(2000),
                status VARCHAR(10) DEFAULT 'ACCEPTED' NOT NULL,
                variant_group VARCHAR(40),
                variant_label VARCHAR(120)
              );
              INSERT INTO planned_sessions_new
                (id, plan_id, user_id, date, type, target_distance_meters, target_duration_seconds, description, status)
                SELECT ps.id, ps.plan_id, tp.user_id, ps.date, ps.type,
                       ps.target_distance_meters, ps.target_duration_seconds, ps.description, 'ACCEPTED'
                FROM planned_sessions ps
                LEFT JOIN training_plans tp ON tp.id = ps.plan_id;
              DROP TABLE planned_sessions;
              ALTER TABLE planned_sessions_new RENAME TO planned_sessions;
              CREATE INDEX idx_sessions_plan ON planned_sessions(plan_id);
              CREATE INDEX idx_sessions_user ON planned_sessions(user_id);

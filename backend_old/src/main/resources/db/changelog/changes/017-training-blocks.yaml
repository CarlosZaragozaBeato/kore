databaseChangeLog:
  - changeSet:
      id: 017-training-blocks
      author: ccollector
      changes:
        # Fase F (v4): periodización larga. Bloques macro/meso/micro anidados por
        # parent_id que dan estructura de temporada sobre el calendario. La
        # relación con las sesiones es derivada por solape de fechas (sin FK).
        - createTable:
            tableName: training_blocks
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: level
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: focus
                  type: VARCHAR(15)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: load_stance
                  type: VARCHAR(10)
              - column:
                  name: note
                  type: VARCHAR(2000)
        - createIndex:
            tableName: training_blocks
            indexName: idx_blocks_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: training_blocks
            indexName: idx_blocks_parent
            columns:
              - column:
                  name: parent_id

version: '3.8'

networks:
  kore-network:
    name: kore-network
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: kore-postgres
    environment:
      POSTGRES_DB: kore_db
      POSTGRES_USER: kore_user
      POSTGRES_PASSWORD: kore_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kore-network

volumes:
  postgres_data: